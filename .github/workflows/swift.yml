name: Swift

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'README.md'
      - 'others/brand/**'
      - 'others/extensions/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'tools/check_*.sh'
      - 'tools/prepare_app.sh'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'Package.swift'
      - 'README.md'
      - 'others/brand/**'
      - 'others/extensions/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'tools/check_*.sh'
      - 'tools/prepare_app.sh'
      - '.github/workflows/swift.yml'

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build release executable
        run: swift build --build-system native --scratch-path "$RUNNER_TEMP/remile-build" --jobs 2 -c release --product Remile
      - name: Standard tests
        run: swift test --build-system native --scratch-path "$RUNNER_TEMP/remile-tests" --jobs 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned local ink tools
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("others/extensions/remarkable/runtime.json").read_text())
          requirements = [f"{p['name']}=={p['version']} --hash=sha256:{p['sha256']}" for p in manifest["packages"]]
          Path(os.environ["RUNNER_TEMP"], "remarkable-tools.txt").write_text("\n".join(requirements) + "\n")
          PY
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r "$RUNNER_TEMP/remarkable-tools.txt"
      - name: SSH and ink helper checks
        run: python -m unittest discover -s Tests/RemarkableSSHChecks -v
